name: GitHub Actions Build

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
    branches:
      - "**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  workflow_dispatch:
    inputs:
      release:
        description: "Create a release"
        type: choice
        required: false
        default: "false"
        options:
          - "true"
          - "false"
      version_increment:
        description: "Default semantic version release type"
        type: choice
        required: false
        default: "minor"
        options:
          - "major"
          - "minor"
          - "patch"

env:
  VERINC: ${{ github.event.inputs.version_increment || 'minor' }}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@main

      - name: Auto Increment Version
        uses: MCKanpolat/auto-semver-action@1.0.12
        id: versioning
        with:
          releaseType: ${{ env.VERINC }}
          incrementPerCommit: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure build
        run: ./premake5 vs2026 --with-version=${{ steps.versioning.outputs.version }}

      - name: Build
        run: |
          msbuild -m build/Ultimate-ASI-Loader-x64.slnx /property:Configuration=Release /property:Platform=x64
          msbuild -m build/Ultimate-ASI-Loader-Win32.slnx /property:Configuration=Release /property:Platform=Win32

      - name: Copy NoPDB binaries
        run: |
          New-Item -ItemType Directory -Force -Path "dist\NoPDB\Win32", "dist\NoPDB\x64" | Out-Null
          Copy-Item "bin\Win32\Release\dinput8.dll" "dist\NoPDB\Win32\dinput8.dll" -Force
          Copy-Item "bin\x64\Release\dinput8.dll" "dist\NoPDB\x64\dinput8.dll" -Force

      - name: Pack binaries
        run: |
          ./embedpdb.bat
          ./sign.bat
          ./release.bat
          ./release.ps1
        env:
          CODE_SIGNING_PFX: ${{ github.ref_name == 'master' && (github.event_name == 'push' || github.event.inputs.release == 'true') && secrets.CODE_SIGNING_PFX || '' }}
          CODE_SIGNING_PASSWORD: ${{ github.ref_name == 'master' && (github.event_name == 'push' || github.event.inputs.release == 'true') && secrets.CODE_SIGNING_PASSWORD || '' }}

      - name: Pack NoPDB binaries
        run: |
          .\7za.exe a -tzip ".\bin\Ultimate-ASI-Loader-NoPDB.zip" ".\dist\NoPDB\Win32\dinput8.dll"
          .\7za.exe a -tzip ".\bin\Ultimate-ASI-Loader-NoPDB_x64.zip" ".\dist\NoPDB\x64\dinput8.dll"

      - name: Test
        shell: cmd
        run: |
          cd tests
          test.bat

      - name: Install artifact client
        run: |
          npm install @actions/artifact

      - name: Upload individual zip artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const { DefaultArtifactClient } = require('./node_modules/@actions/artifact')
            const client = new DefaultArtifactClient()
            const path = require('path')

            const patterns = [
              'bin/Ultimate-ASI-Loader.zip',
              'bin/Ultimate-ASI-Loader_x64.zip',
              'bin/Ultimate-ASI-Loader-NoPDB.zip',
              'bin/Ultimate-ASI-Loader-NoPDB_x64.zip',
              'dist/Win32/zip/*.zip',
              'dist/x64/zip/*.zip'
            ]

            const files = []
            for (const pattern of patterns) {
              const globber = await glob.create(pattern)
              for (const file of await globber.glob()) {
                files.push(file)
              }
            }

            if (files.length === 0) {
              core.warning('No .zip files found to upload.')
              return
            }

            for (const file of files) {
              const name = path.basename(file)
              core.info(`Uploading ${name}...`)
              await client.uploadArtifact(name, [file], path.dirname(file), { retentionDays: 90, skipArchive: true })
            }

      - name: Upload Release (Main)
        if: |
          github.event.inputs.release == 'true' &&
          github.ref_name == 'master' &&
          github.repository == 'ThirteenAG/Ultimate-ASI-Loader'
        uses: ncipollo/release-action@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: false
          name: Ultimate ASI Loader v${{ steps.versioning.outputs.version }}
          bodyFile: "release.md"
          tag: v${{ steps.versioning.outputs.version }}
          artifacts: bin/Ultimate-ASI-Loader.zip, bin/Ultimate-ASI-Loader_x64.zip, bin/Ultimate-ASI-Loader-NoPDB.zip, bin/Ultimate-ASI-Loader-NoPDB_x64.zip

      - name: Get release info (Win32)
        if: |
          github.event.inputs.release == 'true' &&
          github.ref_name == 'master' &&
          github.repository == 'ThirteenAG/Ultimate-ASI-Loader'
        id: release_info_x86
        uses: cardinalby/git-get-release-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: Win32-latest

      - name: Upload Release (Win32)
        if: |
          github.event.inputs.release == 'true' &&
          github.ref_name == 'master' &&
          github.repository == 'ThirteenAG/Ultimate-ASI-Loader'
        uses: ncipollo/release-action@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          name: ${{ steps.release_info_x86.outputs.name }}
          body: ${{ steps.release_info_x86.outputs.body }}
          tag: ${{ steps.release_info_x86.outputs.tag_name }}
          artifacts: dist/Win32/zip/*.zip

      - name: Get release info (Win64)
        if: |
          github.event.inputs.release == 'true' &&
          github.ref_name == 'master' &&
          github.repository == 'ThirteenAG/Ultimate-ASI-Loader'
        id: release_info_x64
        uses: cardinalby/git-get-release-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: x64-latest

      - name: Upload Release (Win64)
        if: |
          github.event.inputs.release == 'true' &&
          github.ref_name == 'master' &&
          github.repository == 'ThirteenAG/Ultimate-ASI-Loader'
        uses: ncipollo/release-action@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          name: ${{ steps.release_info_x64.outputs.name }}
          body: ${{ steps.release_info_x64.outputs.body }}
          tag: ${{ steps.release_info_x64.outputs.tag_name }}
          artifacts: dist/x64/zip/*.zip
