; Paths are absolute or relative to the game's exe folder.
; Nothing is written to disk. Remove the plugin and the game sees its own files again.

[Paths]
; game file = file the game reads instead
;data\movies\intro.bik = data\movies\empty.bik
;settings.cfg = mods\my settings.cfg

[Text]
; game file = its content, with \n, \t and \\ escapes
;settings.cfg = [Video]\nWidth=2560\nHeight=1080\nFullscreen=0
